[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reelay"
version = "0.0.1"
description = "Share a video to Telegram; your AI watches, fact-checks and safely trials what's in it."
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "python-telegram-bot>=21",
    "yt-dlp",
    "segno",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
reelay = "reelay.installer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["reelay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
